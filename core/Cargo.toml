[package]
name = "sauron-core"
version = "0.2.0"
edition = "2021"
default-run = "sauron-core"

[dependencies]
curve25519-dalek = { version = "4.1.3", features = ["digest", "rand_core", "serde"] }
sha2 = "0.10"
rand = "0.8"
argon2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10"   # maintained drop-in for the unsound/unmaintained serde_yml+libyml (RUSTSEC-2025-0067/0068)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
regex = "1"
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
hex = "0.4.3"
tower-http = { version = "0.6.8", features = ["catch-panic", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
prometheus = { version = "0.13", default-features = false }
once_cell = "1.19"
bs58 = "0.5"
sqlx = { version = "0.8.1", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rs_merkle = "1.4"
hmac = "0.12"
hkdf = "0.12"
subtle = "2.6"
jsonwebtoken = "9.3"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# TPM2 attestation M2 dependencies. Pure-Rust crates — kept unconditional so
# `cargo check` (no features) still type-checks the verifier. The `tpm2` feature
# remains a marker for future client-side TPM helpers (tss-esapi etc.) that
# pull system libs.
ring = "0.17"
webpki = { version = "0.22", features = ["std"] }
pem = "3"
# Sprint 13-14: Paillier homomorphic encryption (Tier 2). Big-int arithmetic
# for ~2048-bit modular exponentiation. `num-bigint` is NOT constant-time —
# acceptable for a dev/demo HE module that explicitly requires cryptographer
# review before production secret-aggregation use. See `core/src/he/` and
# `docs/homomorphic-encryption.md` for the full NEEDS_CRYPTO_REVIEW notice.
num-bigint = { version = "0.4", features = ["rand", "serde"] }
num-integer = "0.1"
num-traits = "0.2"
# Transparent production proof verifier.  We deliberately compile the verifier
# without prover/Bonsai features and with dev-mode disabled.  The application
# additionally rejects Groth16 and Fake receipt variants at the wire boundary;
# only native RISC Zero Succinct STARK receipts are accepted.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["disable-dev-mode"] }
sauron-transparent-types = { path = "../transparent-zk/types" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
# Hardware-attestation features. M1 ships parsing skeletons only; full TPM2
# verification (cert-chain walker, vendor roots) is M2 and will hide its
# system-library deps (tss-esapi → libtss2-esys) behind this feature flag.
default = []
tpm2 = []
