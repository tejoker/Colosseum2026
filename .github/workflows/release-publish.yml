name: Release Publish

# Publishes distribution artifacts when a version tag is pushed:
#   - container images (core + dashboard) to GitHub Container Registry
#   - @sauronid/agentic to npm        (needs NPM_TOKEN secret)
#   - sauronid-client to PyPI         (uses PyPI trusted publishing / OIDC)
# Each publish job is independent; a missing credential skips that channel
# instead of failing the release. crates.io is intentionally not a channel:
# the core is a service distributed as a container image, not a library crate.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            context: ./core
          - name: dashboard
            context: ./dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    name: Publish @sauronid/agentic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: agentic
      - run: npm run build && npm test
        working-directory: agentic
      - name: Publish (skipped when NPM_TOKEN is absent)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --access public
        working-directory: agentic
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Publish sauronid-client
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
        working-directory: clients/python
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
          skip-existing: true
