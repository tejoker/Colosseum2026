name: Release Publish

# Publishes distribution artifacts when a version tag is pushed:
#   - container images (core + dashboard) to GitHub Container Registry
#   - @sauronid/agentic to npm        (needs NPM_TOKEN secret)
#   - sauronid-client to PyPI         (uses PyPI trusted publishing / OIDC)
# Each publish job is independent; a missing credential skips that channel
# instead of failing the release. crates.io is intentionally not a channel:
# the core is a service distributed as a container image, not a library crate.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Per-platform agent-action-tool binaries. Consumed by the platform wheels,
  # the npm binary package, and attached to the GitHub release.
  tool-binaries:
    name: Build agent-action-tool (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,   target: linux-x64,   bin: agent-action-tool,     plat: manylinux_2_17_x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, bin: agent-action-tool,     plat: manylinux_2_17_aarch64 }
          - { os: macos-13,        target: darwin-x64,  bin: agent-action-tool,     plat: macosx_10_12_x86_64 }
          - { os: macos-latest,    target: darwin-arm64, bin: agent-action-tool,    plat: macosx_11_0_arm64 }
          - { os: windows-latest,  target: win32-x64,   bin: agent-action-tool.exe, plat: win_amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo build --release --bin agent-action-tool
        working-directory: core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tool-${{ matrix.target }}
          path: core/target/release/${{ matrix.bin }}
          if-no-files-found: error

  wheels:
    name: Platform wheels (sauronid-client)
    needs: tool-binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: linux-x64,   bin: agent-action-tool,     plat: manylinux_2_17_x86_64 }
          - { target: linux-arm64, bin: agent-action-tool,     plat: manylinux_2_17_aarch64 }
          - { target: darwin-x64,  bin: agent-action-tool,     plat: macosx_10_12_x86_64 }
          - { target: darwin-arm64, bin: agent-action-tool,    plat: macosx_11_0_arm64 }
          - { target: win32-x64,   bin: agent-action-tool.exe, plat: win_amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tool-${{ matrix.target }}
          path: clients/python/sauronid_client/_bin/
      - run: chmod +x clients/python/sauronid_client/_bin/${{ matrix.bin }}
      - run: python -m pip install build wheel && python -m build --wheel
        working-directory: clients/python
      - name: Retag wheel for the target platform
        run: python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag ${{ matrix.plat }} dist/*.whl
        working-directory: clients/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target }}
          path: clients/python/dist/*.whl

  npm-tool:
    name: Publish @sauronid/agent-action-tool
    needs: tool-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tool-*
          path: staging/
      - name: Assemble per-platform bin tree
        run: |
          cd packaging/npm-agent-action-tool
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            mkdir -p "bin/$t"
            cp ../../staging/tool-$t/* "bin/$t/"
            chmod +x "bin/$t/"* || true
          done
      - name: Publish (skipped when NPM_TOKEN is absent)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --access public
        working-directory: packaging/npm-agent-action-tool
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  images:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            context: ./core
          - name: dashboard
            context: ./dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    name: Publish @sauronid/agentic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: agentic
      - run: npm run build && npm test
        working-directory: agentic
      - name: Publish (skipped when NPM_TOKEN is absent)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --access public
        working-directory: agentic
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Publish sauronid-client
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # sdist has no bundled binary; it falls back to env/PATH/repo lookup.
      - run: python -m pip install build && python -m build --sdist
        working-directory: clients/python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: clients/python/dist/
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: clients/python/dist
          skip-existing: true
