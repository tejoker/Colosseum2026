name: Unit + Postgres integration

# M1 of the Postgres migration roadmap (docs/roadmap.md Plan 2):
# - `test-sqlite`   runs the existing rusqlite + repo unit suite (default backend).
# - `test-postgres` boots a postgres:16-alpine sidecar, applies the schema from
#   migrations/postgres/0001_initial.sql, exports `SAURON_DB_BACKEND=postgres` +
#   `DATABASE_URL`, runs `cargo test --lib`, then launches the backend and runs
#   the TOCTOU race scenario at redteam/src/scenarios/postgres-toctou-race.ts.

on:
  push:
    branches: [main, pocv1]
  pull_request:
  workflow_dispatch:

jobs:
  test-sqlite:
    name: cargo test --lib (SQLite default backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.1

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-test-sqlite-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            cargo-test-sqlite-${{ runner.os }}-

      - name: cargo check
        working-directory: core
        run: cargo check --locked --lib

      - name: cargo test --lib
        working-directory: core
        run: cargo test --locked --lib

  test-postgres:
    name: cargo test --lib + race scenario (Postgres backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sauron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sauron_test
      SAURON_DB_BACKEND: postgres
      # Per-run dev admin key; populated in the "Generate per-run admin key" step.
      SAURON_ADMIN_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate per-run admin key
        run: echo "SAURON_ADMIN_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.1

      - name: Install postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          exit 1

      - name: Apply Postgres schema (all migrations, in order)
        run: |
          for m in $(ls migrations/postgres/*.sql | sort); do
            echo "applying $m"
            PGPASSWORD=postgres psql -h localhost -U postgres -d sauron_test \
              -v ON_ERROR_STOP=1 -f "$m"
          done

      - name: Assert schema parity with SQLite
        run: bash scripts/ops/check-schema-parity.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sauron_test

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-test-pg-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            cargo-test-pg-${{ runner.os }}-

      - name: cargo test --lib (M1 ported modules)
        working-directory: core
        # SQLite tests in repository.rs::tests still run (they build their own
        # tmp DB). The Postgres-specific paths are exercised by the race
        # scenario below — the unit suite proves the helper compiles + the
        # SQLite branch behaves correctly.
        run: |
          cargo test --locked --lib repository::tests
          cargo test --locked --lib ajwt
          cargo test --locked --lib risk

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: redteam/package-lock.json

      - name: Build redteam scenarios
        working-directory: redteam
        run: |
          npm ci
          npm run build

      - name: Launch backend with Postgres backend
        working-directory: core
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sauron_test
          SAURON_DB_BACKEND: postgres
          SAURON_REQUIRE_CALL_SIG: "1"
          # The Postgres port is partial: un-ported tables still use the local
          # SQLite sidecar (see postgres_backend_drift.sh), so the single-node
          # acknowledgement is required to boot in the default (production)
          # runtime. This CI box IS single-node, so accepting it is honest.
          SAURON_ACCEPT_SINGLE_NODE_SQLITE: "1"
          # ENV is unset here, so the runtime resolves to production and
          # assert_production_enforcement_safe() hard-panics before binding the
          # socket unless every one of these is present. Without them the
          # process died instantly and the health wait below timed out — which
          # is what this job did on every run since the gate was added.
          SAURON_MAX_ACTION_USD: "1000"
        run: |
          export SAURON_AUDIT_HMAC_KEY="$(openssl rand -hex 32)"
          export SAURON_TOKEN_SECRET="$(openssl rand -hex 32)"
          export SAURON_JWT_SECRET="$(openssl rand -hex 32)"
          export SAURON_OPRF_SEED="$(openssl rand -hex 32)"
          # Production refuses to boot unless the reviewed guest image IDs are
          # pinned; use the ones committed in transparent-zk/image-ids.json.
          SAURON_TRANSPARENT_IMAGE_IDS_JSON="$(python3 -c 'import json;print(json.dumps(json.load(open("../transparent-zk/image-ids.json"))["programs"]))')"
          export SAURON_TRANSPARENT_IMAGE_IDS_JSON
          cargo build --locked --bin sauron-core
          nohup ./target/debug/sauron-core > /tmp/sauron-core.log 2>&1 &
          echo $! > /tmp/sauron-core.pid

      - name: Wait for backend health
        # /healthz, not /admin/stats: the latter is a deployment-global view and
        # answers 401 to a tenant-scoped admin key ("use a cross-tenant
        # super-admin"), so it can never be a liveness probe here.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/healthz >/dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          cat /tmp/sauron-core.log || true
          exit 1

      - name: Run Postgres TOCTOU race scenario (M1 + M2 expansion)
        working-directory: redteam
        env:
          API_URL: http://localhost:3001
          SAURON_DB_BACKEND: postgres
          SAURON_RACE_N: "50"
        # Covers (M1) Repo::consume_call_nonce, (M2) Repo::consume_payment_authorization,
        # Repo::consume_bank_attestation_nonce, and the optional
        # Repo::consume_consent_token / Repo::claim_credential_code paths
        # (skipped unless SAURON_TEST_CONSENT_TOKEN / SAURON_TEST_CRED_SESSION
        # are exported).
        run: node dist/scenarios/postgres-toctou-race.js

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/sauron-core.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/sauron-core.pid ]; then
            kill "$(cat /tmp/sauron-core.pid)" || true
          fi
