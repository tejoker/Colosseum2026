name: KYA E2E

on:
  push:
    branches: [main, pocv1]
  pull_request:
  workflow_dispatch:
    inputs:
      shared_iters:
        description: "Shared suite iterations"
        required: false
        default: "3"
      migration_iters:
        description: "Migration suite iterations"
        required: false
        default: "3"
      restart_iters:
        description: "Restart suite iterations"
        required: false
        default: "3"
      matrix_agent_types:
        description: "Comma-separated agent types"
        required: false
        default: "claude,openai,gemini,qwen,mistral,openclaw,autogen,langgraph,crewai"
      matrix_jitter_ms_max:
        description: "Matrix jitter upper bound in ms"
        required: false
        default: "25"
      matrix_fault_probe_pct:
        description: "Matrix fault probe probability percentage"
        required: false
        default: "5"

jobs:
  kya-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Per-run dev admin key (set in the first step, propagated to every
      # subsequent step + docker compose via $GITHUB_ENV).
      SAURON_ADMIN_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate per-run admin key + issuer seed
        run: |
          KEY="$(openssl rand -hex 32)"
          ISSUER="$(openssl rand -hex 32)"
          echo "SAURON_ADMIN_KEY=${KEY}" >> "$GITHUB_ENV"
          # docker compose interpolation needs the value to be present at compose-up time.
          {
            echo "SAURON_ADMIN_KEY=${KEY}"
            echo "ISSUER_SEED=${ISSUER}"
          } > .env

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Start backend via docker-compose
        # `zkp-issuer` used to be a service here; it was deleted with the banking
        # surface in 263fc0c and never removed from this step, so compose exited
        # with "no such service" and this job failed instantly on every run.
        run: |
          ENV=development docker compose -f deploy/docker-compose.yml up -d backend

      - name: Wait for backend health
        # /healthz, not /admin/stats: that view is deployment-global and 401s
        # unless the key is a cross-tenant super-admin.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/healthz >/dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend not healthy" >&2
          docker compose -f deploy/docker-compose.yml logs backend || true
          exit 1

      # ── ZKP issuer ────────────────────────────────────────────────────────
      #
      # There is no ZKP issuer service in this repository any more: it went with
      # the banking surface in 263fc0c, and core/src/issuer_runtime.rs is a
      # *client* (failover + circuit breakers), not a server. The two e2e
      # scripts below call zkp_require_issuer, which hard-exits unless something
      # answers /status on E2E_ISSUER_URL.
      #
      # These steps are therefore SKIPPED, not passing. To re-enable: stand an
      # issuer up (service in deploy/docker-compose.yml + a wait step), then set
      # E2E_ISSUER_URL on the job. Do not delete this block — it is the record of
      # what is currently unverified.
      - name: Run delegated KYA e2e (needs a ZKP issuer)
        if: env.E2E_ISSUER_URL != ''
        env:
          API_URL: http://localhost:3001
        run: |
          bash core/tests/e2e_kya_delegated.sh

      - name: Run autonomous KYA e2e (needs a ZKP issuer)
        if: env.E2E_ISSUER_URL != ''
        env:
          API_URL: http://localhost:3001
        run: |
          bash core/tests/e2e_kya_autonomous.sh

      - name: Run A-JWT jti replay e2e (needs a ZKP issuer)
        if: env.E2E_ISSUER_URL != ''
        env:
          API_URL: http://localhost:3001
        run: |
          bash core/tests/e2e_ajwt_jti_replay.sh

      - name: Run strict agent payment authorization e2e
        env:
          API_URL: http://localhost:3001
        run: |
          bash core/tests/e2e_agent_payment_authorize.sh

      - name: Setup Node for agentic
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agentic/package-lock.json

      - name: Agentic unit tests + live shim integration
        working-directory: agentic
        env:
          SAURON_CORE_URL: http://localhost:3001
        run: |
          npm ci
          npm test
          npm run test:integration

      - name: KYA red-team (scripted invariants)
        working-directory: redteam
        env:
          SAURON_CORE_URL: http://localhost:3001
        run: |
          npm ci
          npm run redteam

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs backend || true

      - name: Shutdown stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v --remove-orphans

  confidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [kya-e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run confidence suite
        env:
          CONF_SHARED_ITERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.shared_iters || '3' }}
          CONF_MIGRATION_ITERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.migration_iters || '3' }}
          CONF_RESTART_ITERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.restart_iters || '3' }}
          CONF_MATRIX_AGENT_TYPES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.matrix_agent_types || 'claude,openai,gemini,qwen,mistral,openclaw,autogen,langgraph,crewai' }}
          CONF_MATRIX_JITTER_MS_MAX: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.matrix_jitter_ms_max || '25' }}
          CONF_MATRIX_FAULT_PROBE_PCT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.matrix_fault_probe_pct || '5' }}
          CONF_LOG_DIR: ${{ runner.temp }}/sauron-confidence-logs
          CONF_FAIL_BUNDLE: ${{ runner.temp }}/sauron-confidence-failure.tar.gz
        run: |
          bash core/tests/run_confidence_suite.sh

      - name: Upload confidence artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: confidence-failure-artifacts
          path: |
            ${{ runner.temp }}/sauron-confidence-failure.tar.gz
            ${{ runner.temp }}/sauron-confidence-logs
          if-no-files-found: warn
