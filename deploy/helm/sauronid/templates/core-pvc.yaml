{{- if and .Values.persistence.enabled (not .Values.postgres.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sauronid.fullname" . }}-core-data
  labels:
    {{- include "sauronid.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
