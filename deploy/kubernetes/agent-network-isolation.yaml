apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sauronid-agent-default-deny
spec:
  podSelector:
    matchLabels:
      sauronid.io/role: agent
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sauronid-agent-allow-dns
spec:
  podSelector:
    matchLabels:
      sauronid.io/role: agent
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sauronid-agent-allow-core-only
spec:
  podSelector:
    matchLabels:
      sauronid.io/role: agent
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              sauronid.io/role: core
      ports:
        - {protocol: TCP, port: 3001}
